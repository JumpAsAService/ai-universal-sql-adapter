services:
  redis:
    image: valkey/valkey:8-alpine
    container_name: dataprep-valkey
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "mypassowrd"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  redis_data: